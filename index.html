<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronograma de Eventos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #000;
    }
    th, td {
      border: 1px solid #000;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
    .highlight {
      background-color: #f9fbe7;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>Horário</th>
        <th colspan="2">Atividades</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>09:00 - 10:00</td>
        <td>Palestra</td>
        <td>Workshop</td>
      </tr>
      <tr class="highlight">
        <td></td>
        <td colspan="2">Networking</td>
      </tr>
      <tr>
        <td>10:30 - 12:00</td>
        <td colspan="2">Momento de discussão</td>
      </tr>
      <tr>
        <td>12:00 - 13:30</td>
        <td colspan="2">Almoço</td>
      </tr>
      <tr>
        <td>13:30 - 15:00</td>
        <td>Workshop</td>
        <td>Mini-curso</td>
      </tr>
      <tr class="highlight">
        <td></td>
        <td colspan="2">Encerramento e Sorteios</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
